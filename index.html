<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#173553"><title>Hitünk nyomában – QR-kaland</title>
<style>
:root{--navy:#173553;--gold:#d4a843;--paper:#f5f7fa;--ink:#202b36;--muted:#607080;--green:#26734d;--red:#a7433c}*{box-sizing:border-box}body{margin:0;background:linear-gradient(150deg,#e8eef5,#faf7ef);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}.wrap{max-width:720px;margin:auto;padding:18px 14px 40px}.brand{font-size:.78rem;letter-spacing:.12em;font-weight:800;color:var(--gold)}header{background:var(--navy);color:white;padding:24px;border-radius:22px;margin:12px 0 16px;box-shadow:0 9px 25px #17355320}h1{font-size:clamp(1.55rem,6vw,2.2rem);line-height:1.15;margin:8px 0}header p{margin:8px 0 0;color:#e5edf5}.card{background:white;border:1px solid #dfe6ed;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 8px 24px #1735530d}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.pill{background:#edf2f7;border-radius:99px;padding:5px 11px;color:var(--navy);font-weight:750;font-size:.9rem}.meter{height:9px;background:#e7edf2;border-radius:9px;overflow:hidden;margin:13px 0}.meter i{display:block;height:100%;background:var(--gold);transition:width .2s}.station{padding:14px 15px;border:1px solid #dfe6ed;border-radius:14px;margin:10px 0}.station strong{color:var(--navy)}.question{font-weight:750;font-size:1.14rem;margin:10px 0 16px}.answers{display:grid;gap:10px}.answers button,.primary,.secondary{font:inherit;border:0;border-radius:12px;padding:14px 16px;text-align:left;cursor:pointer}.answers button{background:#f1f5f8;color:var(--ink);border:2px solid transparent}.answers button:hover{border-color:#9cb1c5}.answers button:disabled{cursor:default;opacity:.75}.answers button.chosen{border-color:var(--navy);background:#eaf0f6}.primary{background:var(--navy);color:white;font-weight:750;text-align:center;width:100%;margin-top:12px}.secondary{background:#edf2f7;color:var(--navy);font-weight:700;text-align:center}.notice{border-radius:12px;padding:12px 14px;margin:12px 0}.good{background:#e8f5ee;color:#205b3d}.bad{background:#fff0ee;color:#8e3731}.muted{color:var(--muted)}label{font-weight:700;display:block;margin:8px 0}input{width:100%;font:inherit;padding:13px;border:1px solid #cbd5df;border-radius:10px}.hidden{display:none!important}.bigscore{font-size:3.4rem;line-height:1.1;color:var(--navy);font-weight:850}.foot{color:var(--muted);font-size:.88rem;text-align:center;padding:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}a{color:var(--navy)}
</style></head>
<body><main class="wrap"><div class="brand">HITÜNK NYOMÁBAN · KATOLIKUS KALAND</div><header><h1>Hat állomás. Egy közös kaland.</h1><p>Olvassátok be az állomáskártyán lévő QR-kódot, válaszoljatok együtt, és gyűjtsétek a pontokat egy telefonon!</p></header><div id="app" aria-live="polite"></div><div class="foot">A haladás ezen a telefonon, ebben a böngészőben tárolódik. Az eredmény nem kerül szerverre.</div></main>
<script>
const stations=[
{title:'Isten és a hitünk',theme:'Alapvető hittani tudás',questions:[
['Hány személy van az egy Istenben a Szentháromság tanítása szerint?',['Kettő','Három','Négy'],1],
['Mit foglal össze a Hiszekegy?',['A keresztény hitet','A szentmise rendjét','A tízparancsolatot'],0],
['Mit jelent a „katolikus” szó?',['Egyetemes','Titkos','Helyi'],0]]},
{title:'Bibliai kaland',theme:'Bibliai történetek',questions:[
['Ki épített bárkát az özönvíz történetében?',['Mózes','Noé','Dávid'],1],
['Melyik város falai omlottak le Józsue könyvében?',['Jerikó','Betlehem','Názáret'],0],
['Mi volt Jézus első jele János evangéliuma szerint?',['Ötezer ember megvendégelése','A vak meggyógyítása','A víz borrá változtatása Kánában'],2]]},
{title:'Jézus nyomában',theme:'Jézus élete és tanítása',questions:[
['Hol született Jézus?',['Názáretben','Betlehemben','Jeruzsálemben'],1],
['Hány apostolt választott Jézus?',['Tizenkettőt','Tizet','Hetet'],0],
['Mire tanít az irgalmas szamaritánus példabeszéde?',['A böjt fontosságára','A felebaráti szeretetre','A templomépítésre'],1]]},
{title:'A szentségek nyomában',theme:'Szentségek és liturgia',questions:[
['Hány szentséget tart számon a katolikus egyház?',['Ötöt','Hetet','Tizenkettőt'],1],
['Melyik szentségben részesülünk a gyónásban?',['Bűnbánat és kiengesztelődés','Bérmálás','Egyházi rend'],0],
['A katolikus hit szerint ki van valóságosan jelen az Eucharisztiában?',['A szentek','Krisztus','Az apostolok'],1]]},
{title:'Imádság és keresztény élet',theme:'Imádság és erkölcsi döntések',questions:[
['Ki tanította a Miatyánkot?',['Jézus','Szent Pál','Mózes'],0],
['Mivel foglalja össze Jézus a törvény lényegét?',['A zarándoklattal','A szeretet kettős parancsával','Az áldozatbemutatással'],1],
['Mit tegyél, ha egy új fiatal egyedül marad a közösségben?',['Várd meg, míg más odamegy','Hagyd békén','Szólítsd meg kedvesen, és szükség esetén kérj felnőtt segítségét'],2]]},
{title:'Szentek és egyházunk',theme:'Szentek, egyházi év és jelképek',questions:[
['Ki volt az első magyar király, akit szentként tisztelünk?',['Szent László','Szent István','Szent Imre'],1],
['Melyik rend alapítója Assisi Szent Ferenc?',['Ferences rend','Bencés rend','Domonkos rend'],0],
['Mire készít fel az adventi időszak?',['Húsvétra','Pünkösdre','Karácsonyra'],2]]}
];
const KEY='hitunk-nyomaban-v1';let data;try{data=JSON.parse(localStorage.getItem(KEY)||'null')}catch{};if(!data||!Array.isArray(data.done)||!Array.isArray(data.scores))data={team:'',done:[],scores:Array(6).fill(null)};
const root=document.getElementById('app');const qp=new URLSearchParams(location.search);const raw=qp.get('allomas')||qp.get('station');const stationNo=/^[1-6]$/.test(raw||'')?Number(raw):0;
function save(){localStorage.setItem(KEY,JSON.stringify(data))}function esc(s){return String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function progress(){let d=data.done.length;return `<div class="card"><div class="row"><strong>Csapat: ${esc(data.team||'Nincs megadva')}</strong><span class="pill">${d}/6 állomás</span></div><div class="meter"><i style="width:${Math.round(d/6*100)}%"></i></div><span class="muted">Eddigi pontszám: <b>${data.scores.reduce((s,x)=>s+(Number(x)||0),0)} / 36</b></span></div>`}
function setup(){root.innerHTML=`<section class="card"><h2>Indulhat a játék?</h2><p>Írjátok be a csapat nevét, majd olvassátok be az első állomás QR-kódját.</p><label for="team">Csapat neve</label><input id="team" maxlength="32" placeholder="Például: Szentjánosbogarak" value="${esc(data.team)}"><button class="primary" id="start">Kezdés</button></section>${progress()}${list()}${reset()}`;document.getElementById('start').onclick=()=>{data.team=document.getElementById('team').value.trim()||'Csapat';save();stationNo?showStation(stationNo):home()};if(stationNo&&data.team)showStation(stationNo)}
function list(){return `<section class="card"><h2>Állomások</h2>${stations.map((s,i)=>`<div class="station"><strong>${i+1}. ${esc(s.title)}</strong><br><span class="muted">${data.done.includes(i+1)?`Kész · ${data.scores[i]} / 6 pont`:esc(s.theme)}</span></div>`).join('')}</section>`}
function reset(){return `<section class="card"><button id="reset" class="secondary">Új csapat / játék újrakezdése</button></section>`}
function bindReset(){let b=document.getElementById('reset');if(b)b.onclick=()=>{if(confirm('Töröljük az ezen a telefonon tárolt eredményt, és új játékot kezdünk?')){localStorage.removeItem(KEY);data={team:'',done:[],scores:Array(6).fill(null)};home()}}}
function home(){if(data.done.length===6){finish();return}root.innerHTML=`<section class="card"><h2>Szia, ${esc(data.team||'csapat')}!</h2><p>Keressétek meg a következő állomást, és olvassátok be annak QR-kódját. A pontjaitok megmaradnak ezen a telefonon.</p></section>${progress()}${list()}${reset()}`;bindReset()}
function showStation(n){if(!data.team){setup();return}if(data.done.includes(n)){root.innerHTML=`<section class="card"><span class="pill">${n}. állomás</span><h2>${esc(stations[n-1].title)}</h2><div class="notice good">Ezt az állomást már teljesítettétek: <b>${data.scores[n-1]} / 6 pont</b>.</div><p>Keressétek meg a következő állomás QR-kódját!</p><button class="primary" id="back">Haladás megtekintése</button></section>${progress()}${list()}${reset()}`;document.getElementById('back').onclick=home;bindReset();return}
let index=0,score=0,locked=false;function draw(){const s=stations[n-1],q=s.questions[index];root.innerHTML=`<div class="row"><span class="pill">${n}. állomás</span><span class="pill">${index+1}/3 kérdés</span></div><section class="card"><h2>${esc(s.title)}</h2><p class="muted">${esc(s.theme)}</p><div class="meter"><i style="width:${Math.round(index/3*100)}%"></i></div><div class="question">${esc(q[0])}</div><div class="answers">${q[1].map((a,i)=>`<button data-answer="${i}">${String.fromCharCode(65+i)} · ${esc(a)}</button>`).join('')}</div><div id="feedback"></div></section>${progress()}${reset()}`;bindReset();root.querySelectorAll('[data-answer]').forEach(btn=>btn.onclick=()=>{if(locked)return;locked=true;let ok=Number(btn.dataset.answer)===q[2];if(ok)score+=2;root.querySelectorAll('[data-answer]').forEach(b=>b.disabled=true);btn.classList.add('chosen');document.getElementById('feedback').innerHTML=`<div class="notice ${ok?'good':'bad'}">${ok?'Helyes válasz! +2 pont':'Most nem járt pont. Jöhet a következő kérdés!'}</div><button class="primary" id="next">${index===2?'Állomás lezárása':'Következő kérdés'}</button>`;document.getElementById('next').onclick=()=>{index++;if(index<3){locked=false;draw()}else complete()}})}
function complete(){data.done.push(n);data.scores[n-1]=score;save();let all=data.done.length===6;root.innerHTML=`<section class="card"><span class="pill">${n}. állomás kész</span><h2>${all?'Megvan mind a hat állomás!':'Szép munka, csapat!'}</h2><p>Ezen az állomáson szerzett pont:</p><div class="bigscore">${score}<span style="font-size:1.2rem"> / 6</span></div><div class="notice good">Összesen eddig: <b>${data.scores.reduce((a,b)=>a+(Number(b)||0),0)} / 36 pont</b></div>${all?'<p>A végső pontszámot diktáljátok be a szervezőnek!</p>':'<p>Menjetek tovább, és olvassátok be a következő állomás QR-kódját.</p>'}<button class="primary" id="continue">${all?'Végső pontszám':'Haladás megtekintése'}</button></section>${progress()}${reset()}`;document.getElementById('continue').onclick=all?finish:home;bindReset()}
draw()}
function finish(){let score=data.scores.reduce((a,b)=>a+(Number(b)||0),0);root.innerHTML=`<section class="card" style="text-align:center"><div class="brand">KÜLDETÉS TELJESÍTVE</div><h2>Gratulálunk, ${esc(data.team||'csapat')}!</h2><p>Hat állomás, tizennyolc kérdés.</p><div class="bigscore">${score}<span style="font-size:1.2rem"> / 36 pont</span></div><p class="notice good">Ezt a pontszámot diktáljátok be a szervezőnek.</p></section>${list()}${reset()}`;bindReset()}
setup();
</script></body></html>
